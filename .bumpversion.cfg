[bumpversion]
current_version = 0.3.0
commit = True
tag = True
tag_name = v{new_version}
message = chore(release): bump version {current_version} → {new_version}

[bumpversion:file:Cargo.toml]
search = name = "siphon"
	version = "{current_version}"
replace = name = "siphon"
	version = "{new_version}"

[bumpversion:file:Cargo.lock]
search = name = "siphon"
	version = "{current_version}"
replace = name = "siphon"
	version = "{new_version}"
